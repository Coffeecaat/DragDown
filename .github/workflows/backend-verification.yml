name: Backend verification

on:
  push:
    branches:
      - main
      - integrate/backend-dev-main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run unit and required Redis integration tests
        run: ./gradlew check --no-daemon
